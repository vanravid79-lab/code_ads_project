<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Three-image Ad</title>

	<style>
		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
		}

		.banner {
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		.banner img {
			display: block;
			width: 100%;
			height: 33.3333%;
			object-fit: cover;
		}
	</style>
</head>

<body>
	<div class="banner">
		<img src="./images/img33.png" alt="Angkor Beer image 1">
		<img src="./images/img_6.png" alt="Angkor Beer image 2">
		<img src="./images/img_5.png" alt="Angkor Beer image 3">
	</div>

</body>

</html>
